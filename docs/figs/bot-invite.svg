<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" font-family="Hiragino Sans, Yu Gothic UI, Meiryo, Segoe UI, sans-serif">
  <title>ボットを、サーバーに入れてもらうまで</title>
  <desc>1 あなたが、開発者サイトでボットを作り、本文を読む設定を ON にする。2 あなたが、招待の URL を作って、サーバーの管理者に頼む。3 管理者が、URL を開いてボットをサーバーに入れ、見える範囲をロールで決める。4 あなたが、python triage.py check で、読めるかを確かめる。頼むときは、読むだけで、書き込みの権限は要らないと伝える。トークンは、管理者にも誰にも渡さない。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <text x="480" y="44" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">ボットを、サーバーに入れてもらうまで</text>

  <!-- 1 -->
  <rect x="33" y="76" width="210" height="196" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="49" y="92" width="70" height="26" rx="13" fill="#4f46e5"/>
  <text x="84" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">あなた</text>
  <text x="49" y="152" font-size="17" font-weight="700" fill="#0f172a">1. ボットを作る</text>
  <text x="49" y="184" font-size="13" fill="#334155">開発者サイトで、名前を</text>
  <text x="49" y="206" font-size="13" fill="#334155">付けて作る。本文を読む</text>
  <text x="49" y="228" font-size="13" fill="#334155">設定を ON にする</text>

  <line x1="245" y1="174" x2="258" y2="174" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="261" y="76" width="210" height="196" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="277" y="92" width="70" height="26" rx="13" fill="#4f46e5"/>
  <text x="312" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">あなた</text>
  <text x="277" y="152" font-size="17" font-weight="700" fill="#0f172a">2. 招待を頼む</text>
  <text x="277" y="184" font-size="13" fill="#334155">招待の URL を作って、</text>
  <text x="277" y="206" font-size="13" fill="#334155">サーバーの管理者に、</text>
  <text x="277" y="228" font-size="13" fill="#334155">「読むだけ」と伝えて頼む</text>

  <line x1="473" y1="174" x2="486" y2="174" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="489" y="76" width="210" height="196" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="505" y="92" width="70" height="26" rx="13" fill="#ea580c"/>
  <text x="540" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">管理者</text>
  <text x="505" y="152" font-size="17" font-weight="700" fill="#0f172a">3. サーバーに入れる</text>
  <text x="505" y="184" font-size="13" fill="#334155">URL を開いて追加し、</text>
  <text x="505" y="206" font-size="13" fill="#334155">見える範囲を、ロールで</text>
  <text x="505" y="228" font-size="13" fill="#334155">決める</text>

  <line x1="701" y1="174" x2="714" y2="174" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="717" y="76" width="210" height="196" rx="14" fill="#e7f6ea" stroke="#15803d" stroke-width="1.5"/>
  <rect x="733" y="92" width="70" height="26" rx="13" fill="#4f46e5"/>
  <text x="768" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">あなた</text>
  <text x="733" y="152" font-size="17" font-weight="700" fill="#0f172a">4. 確かめる</text>
  <text x="733" y="184" font-size="13" fill="#334155">triage.py check が、</text>
  <text x="733" y="206" font-size="13" fill="#334155">Discord を読めるかを</text>
  <text x="733" y="228" font-size="13" fill="#334155">教えてくれる</text>

  <!-- 下の帯 -->
  <rect x="33" y="290" width="894" height="40" rx="10" fill="#e7f6ea" stroke="#15803d" stroke-width="1.5"/>
  <text x="53" y="315" font-size="14" font-weight="700" fill="#15803d">頼むときは</text>
  <text x="150" y="315" font-size="14" fill="#0f172a">「読むだけ」「書き込みの権限は要らない」と伝え、自分と同じ範囲が見えるロールを頼む</text>
  <rect x="33" y="340" width="894" height="40" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="53" y="365" font-size="14" font-weight="700" fill="#854d0e">トークンは</text>
  <text x="150" y="365" font-size="14" fill="#0f172a">手順 1 のあとで控える。管理者にも、誰にも渡さない（渡すのは、招待の URL だけ）</text>
</svg>
