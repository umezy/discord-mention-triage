<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>Claude が動かなかった回は、失敗に数えない</title>
  <desc>利用枠が切れている間にメンションが届いたとき。そのまま数えると、Claude は動かないので仕分けは必ず失敗し、届いた分をぜんぶ 3 回であきらめることになり、枠が戻っても仕分けられない。決定は、Claude が動かなかった回（エラーで、費用 0）を失敗に数えない形で、届いた分はそのまま溜めて待ち、枠が戻ったら仕分ける。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="292" fill="#FFFFFF"/>
  <rect x="20" y="14" width="640" height="112" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#993C1D" text-anchor="start" dominant-baseline="central">そのまま数えると</text>
  <rect x="36" y="48" width="128" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="100.0" y="69.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">メンションが届く</text>
  <text x="100.0" y="90.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">利用枠切れの間</text>
  <rect x="196" y="48" width="128" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="260.0" y="69.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">必ず失敗する</text>
  <text x="260.0" y="90.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Claude は動かない</text>
  <path d="M164 80 L194 80" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="356" y="48" width="128" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="420.0" y="69.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3 回であきらめる</text>
  <text x="420.0" y="90.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">届いた分ぜんぶ</text>
  <path d="M324 80 L354 80" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="516" y="48" width="128" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="580.0" y="69.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">仕分けられない</text>
  <text x="580.0" y="90.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">枠が戻っても</text>
  <path d="M484 80 L514 80" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="20" y="140" width="640" height="112" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="156" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定: Claude が動かなかった回は、数えない</text>
  <rect x="36" y="174" width="128" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="100.0" y="195.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">メンションが届く</text>
  <text x="100.0" y="216.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">利用枠切れの間</text>
  <rect x="196" y="174" width="128" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="260.0" y="195.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">失敗に数えない</text>
  <text x="260.0" y="216.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">エラーで、費用 0</text>
  <path d="M164 206 L194 206" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="356" y="174" width="128" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="420.0" y="195.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">溜めて、待つ</text>
  <text x="420.0" y="216.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">届いた分はそのまま</text>
  <path d="M324 206 L354 206" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="516" y="174" width="128" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580.0" y="195.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">あとで仕分ける</text>
  <text x="580.0" y="216.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">枠が戻ったら</text>
  <path d="M484 206 L514 206" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="340.0" y="274" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Claude が動いたかは、結果の費用で見分ける（エラーで、費用 0 なら、動いていない）</text>
</svg>
