<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>止まり方を 2 つに分ける</title>
  <desc>仕分けが失敗したら、Claude が動いたかを、結果の費用で見る。エラーで費用が 0 なら、Claude は動いていない。ログイン切れ、利用枠、API の障害が原因で、届いたメンションのせいではないので、やり直しの回数に数えず、届いた分を溜めたまま待ち、直れば溜めた分から再開する。それ以外の失敗（途中で落ちた、時間切れ、出力が足りない）は、その件のせいかもしれないので回数に数え、3 回でその件だけをよけて、ほかの件は止めない。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="352" fill="#FFFFFF"/>
  <rect x="20" y="128" width="132" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="86.0" y="149.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">仕分けが失敗</text>
  <text x="86.0" y="170.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">やり直す前に</text>
  <rect x="196" y="116" width="176" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="284.0" y="141.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Claude は動いたか</text>
  <text x="284.0" y="161.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">結果の費用を見る</text>
  <text x="284.0" y="178.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">（--output-format json）</text>
  <path d="M152 160 L194 160" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="442" y="24" width="218" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="551.0" y="48.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">回数に数えず、待つ</text>
  <text x="551.0" y="69.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">届いた件のせいではない</text>
  <text x="551.0" y="86.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">届いた分は、溜めておく</text>
  <text x="551.0" y="103.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">直れば、溜めた分から再開</text>
  <rect x="442" y="196" width="218" height="104" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="551.0" y="220.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">回数に数える</text>
  <text x="551.0" y="241.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">その件のせいかもしれない</text>
  <text x="551.0" y="258.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">3 回で、その件だけよける</text>
  <text x="551.0" y="275.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ほかの件は、止めない</text>
  <path d="M372 138 L440 92" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M372 182 L440 232" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="313.0" y="85" width="90.0" height="22" rx="11" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="358" y="96" font-size="12" font-weight="500" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">動いていない</text>
  <text x="358" y="74" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">エラーで、費用 0</text>
  <rect x="327.0" y="213" width="66.0" height="22" rx="11" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="360" y="224" font-size="12" font-weight="500" fill="#993C1D" text-anchor="middle" dominant-baseline="central">それ以外</text>
  <text x="551" y="144" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例: ログイン切れ・利用枠・API の障害</text>
  <text x="551" y="316" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例: 途中で落ちた・時間切れ・出力不足</text>
</svg>
