<svg xmlns="http://www.w3.org/2000/svg" width="680" height="328" viewBox="0 0 680 328" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>API キーが環境にあると、従量課金になる</title>
  <desc>PC の環境変数に ANTHROPIC_API_KEY が残っているとき。そのまま渡して起動すると、claude -p は API キーを必ず使い、サブスクリプションではなく API の従量課金になる。決定は、ANTHROPIC_ と CLAUDE_CODE_ で始まる環境変数を外してから起動する形で、claude -p は専用のトークンで動き、サブスクリプションの利用枠を使う。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="328" fill="#FFFFFF"/>
  <rect x="20" y="14" width="640" height="122" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#993C1D" text-anchor="start" dominant-baseline="central">そのまま起動すると</text>
  <rect x="40" y="48" width="176" height="74" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="128.0" y="66.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PC の環境変数</text>
  <text x="128.0" y="86.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ANTHROPIC_API_KEY が</text>
  <text x="128.0" y="103.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">残っている</text>
  <rect x="302" y="48" width="140" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="372.0" y="74.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <text x="372.0" y="95.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">API キーを必ず使う</text>
  <rect x="500" y="48" width="142" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="571.0" y="74.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">API の従量課金</text>
  <text x="571.0" y="95.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">気づかずに切り替わる</text>
  <path d="M216 85 L300 85" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="258" y="73" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">そのまま渡す</text>
  <path d="M442 85 L498 85" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="20" y="150" width="640" height="122" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="166" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定: 外してから起動する</text>
  <rect x="40" y="184" width="176" height="74" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="128.0" y="202.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PC の環境変数</text>
  <text x="128.0" y="222.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ANTHROPIC_API_KEY が</text>
  <text x="128.0" y="239.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">残っている</text>
  <rect x="302" y="184" width="140" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="372.0" y="210.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <text x="372.0" y="231.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">専用のトークンで動く</text>
  <rect x="500" y="184" width="142" height="74" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="571.0" y="210.75" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">サブスクの利用枠</text>
  <text x="571.0" y="231.25" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">課金は変わらない</text>
  <path d="M216 221 L300 221" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="258" y="209" font-size="12" font-weight="500" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">外してから渡す</text>
  <path d="M442 221 L498 221" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="258" y="235" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ANTHROPIC_*</text>
  <text x="258" y="249" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">CLAUDE_CODE_*</text>
  <text x="340.0" y="310" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">claude -p は、環境変数に API キーがあると、必ずそちらを使う</text>
</svg>
