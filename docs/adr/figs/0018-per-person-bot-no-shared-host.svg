  <text x="432.5" y="140.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A さんのボット</text>
  <rect x="370" y="190" width="125" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="432.5" y="217.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A さんの PC</text>
  <text x="432.5" y="238.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">受付・開封・仕分け</text>
  <rect x="370" y="300" width="125" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="432.5" y="322.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">専用チャンネル</text>
  <path d="M432 66 L432 116" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M432 162 L432 188" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M432 262 L432 298" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="515" y="118" width="125" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="577.5" y="140.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B さんのボット</text>
  <rect x="515" y="190" width="125" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="577.5" y="217.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B さんの PC</text>
  <text x="577.5" y="238.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">受付・開封・仕分け</text>
  <rect x="515" y="300" width="125" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="577.5" y="322.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">専用チャンネル</text>
  <path d="M577 66 L577 116" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M577 162 L577 188" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M577 262 L577 298" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="340" y="388" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">決定の形では、見える範囲はボットのロールで Discord が守り、鍵は作った本人の PC だけに置く</text>
</svg>
