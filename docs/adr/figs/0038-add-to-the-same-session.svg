<svg xmlns="http://www.w3.org/2000/svg" width="680" height="334" viewBox="0 0 680 334" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>同じ流れの続きは、前のセッションに書き足す</title>
  <desc>これまでは、同じ流れの 2 件目は 1 件目のセッション A を写したセッション B（続き）で、3 件目は B を写したセッション C（続き）で仕分けた。デスクトップ版の一覧には、件ごとに 1 件ずつ並んだ。これからは、2 件目も 3 件目もセッション A に書き足すので、一覧は A の 1 件のまま。ただし、A をいま動いている Claude Code（デスクトップ版の裏の処理など）が開いているときや、A がアーカイブされているときは、これまでどおり写す。書き足しても、一覧の並びは上がらない。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="334" fill="#FFFFFF"/>
  <text x="15" y="24" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これまで（ADR-0036）</text>
  <rect x="15" y="40" width="200" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">1 件目: セッション A</text>
  <text x="115.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一覧に 1 件</text>
  <rect x="245" y="40" width="200" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="345.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2 件目: B（続き）</text>
  <text x="345.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">A を写す。一覧が 1 件増える</text>
  <rect x="475" y="40" width="200" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="575.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3 件目: C（続き）</text>
  <text x="575.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">B を写す。一覧が 1 件増える</text>
  <path d="M215 70 L243 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M445 70 L473 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="15" y="144" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これから</text>
  <rect x="15" y="160" width="200" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">1 件目: セッション A</text>
  <text x="115.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一覧に 1 件</text>
  <rect x="245" y="160" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2 件目: A に書き足す</text>
  <text x="345.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一覧は増えない</text>
  <rect x="475" y="160" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="575.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3 件目: A に書き足す</text>
  <text x="575.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一覧は A の 1 件のまま</text>
  <path d="M215 190 L243 190" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M445 190 L473 190" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="340.0" y="252" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ただし、A をいま Claude Code（デスクトップ版の裏の処理など）が開いているときや、</text>
  <text x="340.0" y="274" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">A がアーカイブされているときは、これまでどおり写す（開いている間に書き足すと、記録が枝分かれする）</text>
  <text x="340.0" y="304" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">書き足しても、一覧の並びは上がらない（並びは、デスクトップ版の中で話した時刻で決まる）</text>
</svg>
