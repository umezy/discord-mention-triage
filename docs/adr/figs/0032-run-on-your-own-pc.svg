<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>仕分けは自分の PC で動かす。PC の外で動かす形は、オプションとしても入れない</title>
  <desc>決定: 自分の PC で、タスクスケジューラが 2 分おきに dispatch.py を起こし、Claude Code の claude -p が仕分ける。PC で Claude Code が動くので、手元のリポジトリを読んで事実を確かめる、セッションをデスクトップ版で開いて続きを話す、手元の記録をスキルがその場で調べる、ができる。採らなかった案: GitHub Actions（5 分おきが最短で、混むと遅れる）、Managed Agents（空振りでも Claude が動き、書き込まないことを指示で守る形になる）、常時動く Linux の機械（機械の世話が増え、本文と鍵が PC の外へ移る）。どれも、上の 3 つを手放す。PC が止まっている間の分は、起きた最初の回がまとめて拾う（最大 72 時間）。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="396" fill="#FFFFFF"/>
  <rect x="20" y="14" width="640" height="184" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定: 自分の PC で動かす</text>
  <rect x="40" y="48" width="150" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="67" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2 分おきに起動</text>
  <text x="115" y="87" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">タスクスケジューラ</text>
  <rect x="265" y="48" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="67" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">dispatch.py</text>
  <text x="340" y="87" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">受付・開封・投稿</text>
  <rect x="490" y="48" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="565" y="67" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <text x="565" y="87" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Claude Code</text>
  <path d="M190 76 L263 76" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M415 76 L488 76" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="40" y="119" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">PC で Claude Code が動くので、できること</text>
  <rect x="40" y="132" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="135" y="150" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">手元のリポジトリ</text>
  <text x="135" y="169" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">読んで事実を確かめる</text>
  <rect x="245" y="132" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="150" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">デスクトップ版</text>
  <text x="340" y="169" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">セッションの続きを話す</text>
  <rect x="450" y="132" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="545" y="150" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">手元の記録</text>
  <text x="545" y="169" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">スキルがその場で調べる</text>
  <rect x="20" y="212" width="640" height="140" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="228" font-size="13" font-weight="500" fill="#993C1D" text-anchor="start" dominant-baseline="central">採らなかった案: PC の外で動かす（オプションにもしない）</text>
  <rect x="40" y="246" width="180" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="130" y="264.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
  <text x="130" y="284.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">5 分おきが最短</text>
  <text x="130" y="301.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">混むと遅れる</text>
  <rect x="250" y="246" width="180" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="264.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Managed Agents</text>
  <text x="340" y="284.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">空振りでも Claude が動く</text>
  <text x="340" y="301.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">書き込まないを、指示で守る</text>
  <rect x="460" y="246" width="180" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="550" y="264.25" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">常時動く Linux</text>
  <text x="550" y="284.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">機械の世話が増える</text>
  <text x="550" y="301.75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">本文と鍵が PC の外へ</text>
  <text x="340" y="337" font-size="12" font-weight="500" fill="#993C1D" text-anchor="middle" dominant-baseline="central">どれも、上の 3 つを手放す</text>
  <text x="340" y="376" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PC が止まっている間の分は、起きた最初の回がまとめて拾う（最大 72 時間）</text>
</svg>
