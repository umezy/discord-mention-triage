<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', sans-serif">
  <title>登場人物の全体と、Claude のアカウント情報の置き場</title>
  <desc>上半分はメンションの流れ。起こし役が受付と開封係を起動し、Discord から受付、郵便受け、開封係、秘書、配達係、専用チャンネル、あなたへ流れる。下半分は Claude のアカウント情報の財布。デスクトップ版アプリと黒い画面の claude はそれぞれ自分の財布を持つ。秘書はいま黒い画面の claude の財布を借りていて、トークンを作ると秘書専用の財布になる。</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="680" height="640" fill="#FFFFFF"/>

  <g fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5">
    <rect x="195" y="40" width="445" height="44" rx="8"/>
    <rect x="40" y="120" width="135" height="64" rx="8"/>
    <rect x="195" y="120" width="135" height="64" rx="8"/>
    <rect x="350" y="120" width="135" height="64" rx="8"/>
    <rect x="505" y="120" width="135" height="64" rx="8"/>
    <rect x="350" y="240" width="135" height="64" rx="8"/>
    <rect x="195" y="240" width="135" height="64" rx="8"/>
    <rect x="40" y="240" width="135" height="64" rx="8"/>
    <rect x="56" y="385" width="176" height="64" rx="8"/>
    <rect x="252" y="385" width="176" height="64" rx="8"/>
    <rect x="56" y="500" width="176" height="64" rx="8"/>
  </g>
  <rect x="505" y="240" width="135" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="252" y="500" width="176" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="448" y="500" width="176" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="5 4"/>
  <rect x="40" y="340" width="600" height="250" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>

  <g font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">
    <text x="417" y="62">起こし役（タスクスケジューラ）— 受付と開封係を起動する</text>
    <text x="107" y="141">Discord</text>
    <text x="262" y="141">受付</text>
    <text x="417" y="141">郵便受け</text>
    <text x="572" y="141">開封係</text>
    <text x="417" y="261">配達係</text>
    <text x="262" y="261">専用チャンネル</text>
    <text x="107" y="261">あなた</text>
    <text x="144" y="406">デスクトップ版アプリ</text>
    <text x="340" y="406">黒い画面の claude</text>
    <text x="144" y="521">アプリの財布</text>
    <text x="572" y="261" fill="#3C3489">秘書（Claude）</text>
    <text x="340" y="521" fill="#712B13">claude の財布</text>
    <text x="536" y="521" fill="#085041">トークン（秘書専用）</text>
  </g>
  <text x="56" y="360" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Claude のアカウント情報（財布）</text>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">
    <text x="107" y="163">メンションが来る</text>
    <text x="262" y="163">拾って入れる</text>
    <text x="417" y="163">未開封の山</text>
    <text x="572" y="163">1 分おきに見る</text>
    <text x="417" y="283">チャンネルへ投稿</text>
    <text x="262" y="283">スマホに通知</text>
    <text x="107" y="283">返信かスタンプ</text>
    <text x="144" y="428">アプリでログインする</text>
    <text x="340" y="428">login し直すと替わる</text>
    <text x="144" y="543">秘書は使わない</text>
    <text x="572" y="283" fill="#534AB7">読んで下書き</text>
    <text x="340" y="543" fill="#993C1D">秘書がいま借りている</text>
    <text x="536" y="543" fill="#0F6E56">setup-token で作る</text>
  </g>

  <g fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)">
    <line x1="262" y1="86" x2="262" y2="110" stroke-dasharray="2 3"/>
    <line x1="572" y1="86" x2="572" y2="110" stroke-dasharray="2 3"/>
    <line x1="177" y1="152" x2="192" y2="152"/>
    <line x1="332" y1="152" x2="347" y2="152"/>
    <line x1="487" y1="152" x2="502" y2="152"/>
    <line x1="572" y1="186" x2="572" y2="230"/>
    <line x1="503" y1="272" x2="488" y2="272"/>
    <line x1="348" y1="272" x2="333" y2="272"/>
    <line x1="193" y1="272" x2="178" y2="272"/>
    <line x1="144" y1="451" x2="144" y2="490"/>
    <line x1="340" y1="451" x2="340" y2="490"/>
  </g>
  <path d="M530 306 L530 470 L380 470 L380 490" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <line x1="572" y1="306" x2="572" y2="490" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-teal)"/>

  <g font-size="12" fill="#5F5E5A" dominant-baseline="central">
    <line x1="40" y1="615" x2="70" y2="615" stroke="#D85A30" stroke-width="1.5"/><text x="78" y="615">いまは隣の財布を借りている</text>
    <line x1="270" y1="615" x2="300" y2="615" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="6 4"/><text x="308" y="615">トークンを作ると秘書の財布になる</text>
    <rect x="530" y="608" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="552" y="615">Claude を使うのは秘書だけ</text>
  </g>
</svg>
