<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>取得は検索 API を数分おきに引き、入口を 1 つにする</title>
  <desc>これまで: 受付が Gateway に常駐し（discord.py と venv）、inbox/ に書き、別のプロセスの開封係が毎分起動していた。ロック 2 種類、heartbeat、起動時の全チャンネル走査、自動起動の登録 2 本と、部品が多かった。決定: タスクスケジューラが 2 分おきに dispatch.py を起動し、同じプロセスで受付（検索 API を GET）、開封、仕分け、投稿を順に行う。標準ライブラリだけで動き、届くまで 3〜6 分。スリープ明けは同じ検索を引いて追いつく。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="400" fill="#FFFFFF"/>
  <rect x="20" y="14" width="640" height="170" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">これまで</text>
  <rect x="40" y="50" width="100" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="90.0" y="82.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Discord</text>
  <rect x="170" y="50" width="150" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="245.0" y="65.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">受付</text>
  <text x="245.0" y="85.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Gateway に常駐</text>
  <text x="245.0" y="102.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">discord.py と venv</text>
  <rect x="350" y="50" width="100" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="400.0" y="82.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">inbox/</text>
  <rect x="480" y="50" width="160" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="560.0" y="73.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">開封</text>
  <text x="560.0" y="94.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">別のプロセス・毎分起動</text>
  <path d="M140 82 L168 82" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M320 82 L348 82" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M450 82 L478 82" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="128" width="600" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="148" font-size="13" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">部品が多い: ロック 2 種類、heartbeat、起動時の全チャンネル走査、自動起動の登録 2 本</text>
  <rect x="20" y="198" width="640" height="188" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="214" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定</text>
  <rect x="40" y="244" width="150" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="267.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">タスクスケジューラ</text>
  <text x="115.0" y="288.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2 分おき</text>
  <rect x="220" y="228" width="430" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="234" y="244" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">dispatch.py: 1 つのプロセスで、順に</text>
  <rect x="234" y="262" width="88" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="278.0" y="278.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">受付</text>
  <text x="278.0" y="299.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">検索 API</text>
  <rect x="338" y="262" width="88" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="382.0" y="278.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">開封</text>
  <text x="382.0" y="299.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">claim</text>
  <path d="M322 287 L336 287" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="442" y="262" width="88" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="486.0" y="278.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">仕分け</text>
  <text x="486.0" y="299.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <path d="M426 287 L440 287" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="546" y="262" width="88" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="590.0" y="278.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">投稿</text>
  <text x="590.0" y="299.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Webhook</text>
  <path d="M530 287 L544 287" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M190 276 L218 276" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="340" y="346" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">標準ライブラリだけで動く（venv も pip も要らない）。届くまで 3〜6 分</text>
  <text x="340" y="366" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">スリープ明けは、同じ検索を引くだけで追いつく（最大 72 時間）</text>
</svg>
