<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>仕分けを、件に合った環境で動かす</title>
  <desc>これまでは、どの件も、仕分けの作業フォルダ run で claude -p を動かし、セッションも run のものだった。デスクトップ版で開いて続きを話しても、run で動く。これからは、仕分けの前に、仕分けと同じモデルが、道具なしで、デスクトップ版の環境の一覧から件に合うものを 1 つ選ぶ。合う環境が無ければ、関連するフォルダから選ぶ。claude -p は、その環境の作業フォルダで動き、足すフォルダも読める。環境の CLAUDE.md は道具で読む。設定ファイルとフックは読まず、書けるのは drafts だけ。セッションはその環境のものになり、デスクトップ版でその環境として続きを話せる。続きの件は選び直さず、前のセッションの環境で動かす。選べなければ run で動かす。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="360" fill="#FFFFFF"/>
  <text x="15" y="24" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これまで</text>
  <rect x="15" y="40" width="150" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="90" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">届いた件</text>
  <text x="90" y="82" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">どの話題でも</text>
  <rect x="195" y="40" width="230" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="310" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p を run で動かす</text>
  <text x="310" y="82" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">プロジェクトのフォルダは、読むだけ</text>
  <rect x="455" y="40" width="210" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="560" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">セッションは run のもの</text>
  <text x="560" y="82" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">デスクトップ版でも run で続く</text>
  <path d="M165 70 L193 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M425 70 L453 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="15" y="138" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これから（pick_environment: true）</text>
  <rect x="15" y="156" width="150" height="80" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="90" y="186" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">届いた件</text>
  <text x="90" y="208" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 回に 1 件</text>
  <rect x="195" y="156" width="150" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="270" y="176" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">環境を選ぶ</text>
  <text x="270" y="197" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">同じモデル、道具なし</text>
  <text x="270" y="215" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">環境か関連フォルダから</text>
  <rect x="375" y="156" width="290" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="176" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p をその環境のフォルダで動かす</text>
  <text x="520" y="197" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">足すフォルダも読む。CLAUDE.md は道具で読む</text>
  <text x="520" y="215" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">設定とフックは読まない。書けるのは drafts/ だけ</text>
  <path d="M165 196 L193 196" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M345 196 L373 196" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <rect x="375" y="262" width="290" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="283.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">セッションはその環境のもの</text>
  <text x="520" y="304" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">デスクトップ版で、その環境として続きを話せる</text>
  <path d="M520 236 L520 260" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="15" y="270" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">・同じ流れの続きは、選び直さず、前の環境で</text>
  <text x="15" y="292" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">・どれも合わなければ、これまでどおり run で</text>
  <text x="15" y="314" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">・鍵の置き場と重なるフォルダの環境は使わない</text>
</svg>
