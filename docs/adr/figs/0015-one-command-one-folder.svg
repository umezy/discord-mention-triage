<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>入口のコマンドを 1 つ、設定と鍵の置き場を 1 つにする</title>
  <desc>これまで: 人が打つ入口が watcher --check、check_claude.py、dispatch.py、tick.py、post_digest.py、install-*.ps1 の 6 つあり、設定は config/config.json と ~/.discord-mention-triage/.env と &lt;名前&gt;/.env の 3 か所に分かれていた。決定: 人が打つのは python triage.py の 1 つ（init、check、run、install、uninstall、status）。設定と鍵の置き場は ~/.discord-mention-triage/ の 1 つ。配るときはフォルダをそのまま渡す（のちに git clone にした）。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="360" fill="#FFFFFF"/>
  <rect x="20" y="14" width="310" height="332" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">これまで</text>
  <text x="40" y="50" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">入口が 6 つ</text>
  <rect x="40" y="64" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="105.0" y="78.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">watcher --check</text>
  <rect x="180" y="64" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="245.0" y="78.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">check_claude.py</text>
  <rect x="40" y="100" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="105.0" y="114.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">dispatch.py</text>
  <rect x="180" y="100" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="245.0" y="114.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">tick.py</text>
  <rect x="40" y="136" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="105.0" y="150.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">post_digest.py</text>
  <rect x="180" y="136" width="130" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="245.0" y="150.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">install-*.ps1</text>
  <text x="40" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">設定が 3 か所</text>
  <rect x="40" y="202" width="270" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="175.0" y="216.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">config/config.json</text>
  <rect x="40" y="238" width="270" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="175.0" y="252.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">~/.discord-mention-triage/.env</text>
  <rect x="40" y="274" width="270" height="28" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="175.0" y="288.0" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">~/.discord-mention-triage/&lt;名前&gt;/.env</text>
  <text x="40" y="324" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">配る: private リポジトリを clone</text>
  <rect x="350" y="14" width="310" height="332" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="364" y="30" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定</text>
  <text x="370" y="50" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">人が打つのは 1 つ</text>
  <rect x="370" y="64" width="270" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="505.0" y="84.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">python triage.py</text>
  <text x="505" y="124" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">init・check・run・install・uninstall・status</text>
  <text x="370" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">置き場は 1 つ</text>
  <rect x="370" y="202" width="270" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="505.0" y="224.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">~/.discord-mention-triage/</text>
  <text x="505.0" y="245.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">config.json</text>
  <text x="505.0" y="262.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">.env（ボットの鍵）</text>
  <text x="505.0" y="279.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">&lt;名前&gt;/.env（Webhook と合鍵）</text>
  <text x="370" y="324" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">配る: フォルダを zip で渡す（のちに git clone）</text>
</svg>
