<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>定期実行は Claude の外に置く</title>
  <desc>採らなかった案: デスクトップ版の定期タスクは、新着が無い回も毎回 Claude のセッションを起こし、利用枠が減って一覧も増える。決定: タスクスケジューラが dispatch.py（AI を使わない）を起動し、新着があるときだけ claude -p を 1 回起こす。新着が無い回は、そのまま終わる。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="340" fill="#FFFFFF"/>
  <rect x="20" y="14" width="640" height="120" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#993C1D" text-anchor="start" dominant-baseline="central">採らなかった案: デスクトップ版の定期タスク</text>
  <rect x="40" y="50" width="150" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="73.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">定期タスク</text>
  <text x="115.0" y="94.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">アプリを開いている間だけ</text>
  <rect x="250" y="50" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="335.0" y="73.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Claude のセッション</text>
  <text x="335.0" y="94.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">新着が無い回も起きる</text>
  <rect x="480" y="50" width="160" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="560.0" y="73.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">利用枠が減る</text>
  <text x="560.0" y="94.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一覧の行も増える</text>
  <path d="M190 82 L248 82" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="219.0" y="72.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">毎回</text>
  <path d="M420 82 L478 82" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="20" y="150" width="640" height="176" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="166" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定</text>
  <rect x="40" y="206" width="150" height="64" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="229.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">タスクスケジューラ</text>
  <text x="115.0" y="250.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 分おき</text>
  <rect x="240" y="200" width="150" height="76" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="315.0" y="221.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">dispatch.py</text>
  <text x="315.0" y="241.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">AI を使わない</text>
  <text x="315.0" y="258.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">数十ミリ秒で終わる</text>
  <rect x="470" y="180" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="555.0" y="199.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p を 1 回</text>
  <text x="555.0" y="220.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">仕分け</text>
  <rect x="470" y="250" width="170" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="555.0" y="269.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">そのまま終わる</text>
  <text x="555.0" y="290.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Claude は起きない</text>
  <path d="M190 238 L238 238" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="214.0" y="228.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">起動</text>
  <path d="M390 232 L468 208" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <text x="428" y="204" font-size="12" font-weight="500" fill="#534AB7" text-anchor="middle" dominant-baseline="central">新着あり</text>
  <path d="M390 244 L468 278" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="426" y="276" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">新着なし</text>
  <text x="340" y="312" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">のちに、2 分おき・入口 1 つの形にした（ADR-0014）</text>
</svg>
