<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>取り込んだあと、見ていたセッションへ表示を戻す</title>
  <desc>これまでは、ほかのセッションで作業していても、仕分けが取り込むたびに、デスクトップ版の表示が仕分けのセッションへ移り、そのままになった。これからは、取り込む前に、最後に開いた時刻が最新のものセッションを控える。取り込むと表示が移るが、取り込んだセッションの記録に開いた時刻が付いたら、すぐ控えたセッションを開くリンクを送り、表示を戻す。仕分けのセッションが映るのは、1 から 2 秒の見込み。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="300" fill="#FFFFFF"/>
  <text x="15" y="24" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これまで</text>
  <rect x="15" y="40" width="200" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">表示: 作業中のセッション</text>
  <text x="115.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ほかの仕事をしている</text>
  <rect x="245" y="40" width="200" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="345.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">仕分けが取り込む</text>
  <text x="345.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">claude --desktop --resume</text>
  <rect x="475" y="40" width="200" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="575.0" y="61.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">表示: 仕分けのセッション</text>
  <text x="575.0" y="82.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">移ったまま戻らない</text>
  <path d="M215 70 L243 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M445 70 L473 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="15" y="144" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">これから</text>
  <rect x="15" y="160" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="115.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">見ていたセッションを控える</text>
  <text x="115.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">最後に開いた時刻が最新のもの</text>
  <rect x="245" y="160" width="200" height="60" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="345.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">取り込む（表示が移る）</text>
  <text x="345.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">開いた時刻が記録に付くまで待つ</text>
  <rect x="475" y="160" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="575.0" y="181.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">表示: 作業中のセッション</text>
  <text x="575.0" y="202.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">控えたセッションへリンクで戻す</text>
  <path d="M215 190 L243 190" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M445 190 L473 190" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="340.0" y="250" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">仕分けのセッションが映るのは 1〜2 秒の見込み。一覧には、これまでどおり並ぶ</text>
  <text x="340.0" y="272" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">開かなかった・見ていたセッションが分からないときは、戻さないだけ（取り込みは続ける）</text>
</svg>
