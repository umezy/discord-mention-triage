<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>メンションの取得には、ボットを使い続ける</title>
  <desc>自分宛てのメンションを読む鍵は 2 つ考えられる。ボットのトークンは、自動処理だと名乗り、管理者が招待し、ロールで範囲を決め、いつでも外せるので採る。本人のログイントークンは、self-bot として規約で禁じられ、管理者もほかの参加者も気づけず、読むだけでも同じなので採らない。白か黒かを分けるのは鍵の種類で、読み方ではない。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="330" fill="#FFFFFF"/>
  <rect x="20" y="120" width="150" height="76" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="95.0" y="149.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">メンションを読む</text>
  <text x="95.0" y="170.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">何の鍵で読むか</text>
  <rect x="200" y="32" width="178" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="289.0" y="63.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">ボットのトークン</text>
  <text x="289.0" y="84.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">自動処理だと名乗る</text>
  <rect x="200" y="204" width="178" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="289.0" y="235.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">本人のログイントークン</text>
  <text x="289.0" y="256.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ブラウザから写す</text>
  <path d="M170 146 L198 80" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <path d="M170 170 L198 236" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="393.0" y="61" width="42.0" height="22" rx="11" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="414" y="72" font-size="12" font-weight="500" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">採る</text>
  <rect x="381.0" y="233" width="66.0" height="22" rx="11" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="414" y="244" font-size="12" font-weight="500" fill="#993C1D" text-anchor="middle" dominant-baseline="central">採らない</text>
  <circle cx="466" cy="46" r="9" fill="#1D9E75"/><path d="M462 46 L465 49 L470 43" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="482" y="46" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">管理者が招待する</text>
  <circle cx="466" cy="72" r="9" fill="#1D9E75"/><path d="M462 72 L465 75 L470 69" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="482" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ロールで見える範囲を決める</text>
  <circle cx="466" cy="98" r="9" fill="#1D9E75"/><path d="M462 98 L465 101 L470 95" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="482" y="98" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">いつでも外せる</text>
  <circle cx="466" cy="218" r="9" fill="#D85A30"/><path d="M462.5 214.5 L469.5 221.5 M469.5 214.5 L462.5 221.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="482" y="218" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">self-bot は規約で禁止</text>
  <circle cx="466" cy="244" r="9" fill="#D85A30"/><path d="M462.5 240.5 L469.5 247.5 M469.5 240.5 L462.5 247.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="482" y="244" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">管理者も、ほかの人も気づけない</text>
  <circle cx="466" cy="270" r="9" fill="#D85A30"/><path d="M462.5 266.5 L469.5 273.5 M469.5 266.5 L462.5 273.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="482" y="270" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">読むだけでも、同じ</text>
  <text x="340" y="312" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">白か黒かを分けるのは、鍵の種類。読み方（その場で受け取るか、数分おきに引くか）ではない</text>
</svg>
