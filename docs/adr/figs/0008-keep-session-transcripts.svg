<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>セッション記録は本番も残す</title>
  <desc>これまでは --no-session-persistence で記録を残さず、Claude が何を読みどう判断したかが、あとから見えなかった。決定: 本番は keep_transcripts: true にし、記録を各自の PC に残す。claude --resume で開ける。記録は Claude Code の既定で 30 日後に消える。コードの既定は false のままにし、設定を忘れたら残さない側に倒す。</desc>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="300" fill="#FFFFFF"/>
  <rect x="20" y="14" width="310" height="272" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="34" y="30" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">これまで（安全側の既定）</text>
  <rect x="60" y="54" width="230" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="175.0" y="75.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <text x="175.0" y="96.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">--no-session-persistence</text>
  <rect x="60" y="154" width="230" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="175.0" y="173.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">記録が残らない</text>
  <text x="175.0" y="193.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">何を読み、どう判断したかが</text>
  <text x="175.0" y="210.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">あとから見えない</text>
  <path d="M175 114 L175 152" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a-coral)"/>
  <rect x="350" y="14" width="310" height="272" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="364" y="30" font-size="13" font-weight="500" fill="#0F6E56" text-anchor="start" dominant-baseline="central">決定（本番は残す）</text>
  <rect x="390" y="54" width="230" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="505.0" y="75.5" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">claude -p</text>
  <text x="505.0" y="96.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">keep_transcripts: true</text>
  <rect x="390" y="154" width="230" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="505.0" y="173.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">セッション記録</text>
  <text x="505.0" y="193.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">各自の PC に残る</text>
  <text x="505.0" y="210.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">何を読み、どう判断したかを追える</text>
  <path d="M505 114 L505 152" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a-teal)"/>
  <text x="505" y="246" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">30 日で自動で消える（Claude Code の既定）</text>
  <text x="505" y="266" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">コードの既定は false（設定を忘れたら、残さない）</text>
</svg>
